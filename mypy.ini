# Type-checking configuration (portfolio item 10).
# Run from the repo root:  python -m mypy
# Scope mirrors ruff.toml: app, ai_agent, scripts, tests + entry points;
# the same debug test files excluded from lint are excluded here.

[mypy]
python_version = 3.12
files = app, ai_agent, scripts, tests, launcher.py, main.py
explicit_package_bases = True
mypy_path = .
warn_unused_configs = True
no_implicit_optional = True
disallow_untyped_defs = False
check_untyped_defs = False
exclude = (debug_chat_route|test_chat_error|test_endpoints|test_ollama_detailed|test_ollama_endpoints|test_routes_debug|test_routes_detailed)\.py

# Third-party libraries without bundled type stubs
[mypy-psutil]
ignore_missing_imports = True

[mypy-yaml]
ignore_missing_imports = True

[mypy-pyperclip]
ignore_missing_imports = True
